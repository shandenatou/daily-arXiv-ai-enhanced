name: Export Zotero Daily Report

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Asia/Shanghai date (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZOTERO_USER_ID: ${{ vars.ZOTERO_USER_ID }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Export exact report from Zotero
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.run_date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid run_date: ${{ inputs.run_date }}"
            exit 1
          fi
          python automation/zotero_export.py \
            --date "${{ inputs.run_date }}" \
            --output-dir /tmp/zotero-report-export

      - name: Upload private report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-paper-report-${{ inputs.run_date }}
          path: /tmp/zotero-report-export/
          if-no-files-found: error
          retention-days: 7
